name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
      - release
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy github_issue_agent
      - name: Test
        run: pytest -q

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel into a clean venv and smoke-test the CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/ai-agent --version
          git init -q /tmp/demo && cd /tmp/demo
          git config user.email ci@example.com && git config user.name ci
          /tmp/smoke/bin/ai-agent init
          printf 'provider: mock\ntest_command: python -c "print(1)"\n' > .ai/config.yaml
          git add -A && git commit -qm init
          /tmp/smoke/bin/ai-agent doctor --json
          /tmp/smoke/bin/ai-agent run work-issue --prompt "smoke" --no-pr --json
