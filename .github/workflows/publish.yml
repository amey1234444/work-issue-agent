name: Publish to PyPI

# Publish only when code lands on these branches. Pushes to any other branch
# (or PRs) never publish. PyPI rejects re-uploading an existing version, so the
# upload step uses skip-existing: a release is only actually pushed when the
# version in pyproject.toml has been bumped; otherwise it is a harmless no-op.
on:
  push:
    branches:
      - main
      - master
      - release
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy github_issue_agent
      - name: Test
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
