name: Release

# Releases are cut from tags of the form vX.Y.Z. The tag must match the version
# in pyproject.toml, so a release is an explicit, reviewable act rather than a
# side effect of merging. Pushes to branches run CI only (see ci.yml).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy github_issue_agent
      - name: Test
        run: pytest -q
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          pkg="$(python -c 'import github_issue_agent;print(github_issue_agent.__version__)')"
          test "$tag" = "$version" -a "$tag" = "$pkg" || { echo "tag v$tag != pyproject $version / package $pkg"; exit 1; }
      - name: Changelog has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
