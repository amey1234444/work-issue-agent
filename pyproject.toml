[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-issue-agent"
version = "0.2.0"
description = "A workflow-driven AI coding agent. Slash-style commands (work-issue, fix-bug, ...) are defined as markdown workflows in .ai/ and the repo's own instruction files are the source of truth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amey Bhagwatkar" }]
keywords = ["ai", "agent", "github", "issues", "llm", "automation", "cli", "openrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/amey1234444/work-issue-agent"
Repository = "https://github.com/amey1234444/work-issue-agent"
Issues = "https://github.com/amey1234444/work-issue-agent/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.39", "openai>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "types-requests"]

[project.scripts]
github-issue-agent = "github_issue_agent.cli:main"
ai-agent = "github_issue_agent.cli:main"

[tool.setuptools]
packages = [
    "github_issue_agent",
    "github_issue_agent.agent",
    "github_issue_agent.merge",
    "github_issue_agent.tools",
    "github_issue_agent.validation",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
